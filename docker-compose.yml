services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-ThuVien@12345}"
      MSSQL_PID: "Express"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  client:
    build:
      context: .
      dockerfile: Backend/Client/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      UploadRoot: "/app/uploads"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ThuVien;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ThuVien@12345};TrustServerCertificate=True;"
      Gemini__ApiKey: "${GEMINI_API_KEY:-}"
    ports:
      - "${CLIENT_PORT:-8080}:8080"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: Backend/Admin/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      UploadRoot: "/app/uploads"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ThuVien;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ThuVien@12345};TrustServerCertificate=True;"
    ports:
      - "${ADMIN_PORT:-8081}:8080"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
  uploads-data:
