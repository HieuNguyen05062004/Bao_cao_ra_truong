<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lịch sử mượn sách - SmartLibrary AI</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body id="history-page">
    <!-- Header -->
    <header class="header">
      <nav class="container nav-bar">
        <div class="logo">
          <a href="index.html">
            <i class="fas fa-book-reader"></i>
            <span>SmartLibrary AI</span>
          </a>
        </div>
        <button id="mobile-menu-btn" class="menu-toggle">
          <i class="fas fa-bars"></i>
        </button>
        <ul class="nav-links" id="nav-menu">
          <li class="nav-mobile-brand">
            <a href="index.html">
              <i class="fas fa-book-reader"></i>
              <span>SmartLibrary AI</span>
            </a>
          </li>
          <li><a href="index.html">Trang chủ</a></li>
          <li><a href="kho-sach.html">Kho sách</a></li>
          <li><a href="lich-su-muon.html" class="active">Phiếu mượn</a></li>
        </ul>
        <div class="user-menu">
          <button class="btn btn-outline btn-sm">Đăng nhập</button>
          <button class="btn btn-accent btn-sm">Đăng ký</button>
        </div>
      </nav>
    </header>

    <main class="container mt-xl">
      <section class="section-header mb-lg">
        <h2 class="section-title">
          <i class="fas fa-history text-accent"></i> Lịch Sử Mượn Sách
        </h2>
        <p class="text-secondary">
          Theo dõi trạng thái và thời hạn trả sách của các phiếu mượn.
        </p>
      </section>

      <!-- Filter Bar -->
      <div class="filter-bar mb-lg">
        <div
          class="search-box basic-mode"
          style="max-width: 400px; margin: 0; flex: 1"
        >
          <i class="fas fa-search ms-3"></i>
          <input
            type="text"
            id="history-search"
            placeholder="Tìm theo mã phiếu..."
          />
        </div>
        <div class="status-filter">
          <select id="status-filter" class="form-select">
            <option value="all">Tất cả trạng thái</option>
            <option value="pending">Chờ duyệt</option>
            <option value="approved">Đã duyệt</option>
            <option value="borrowing">Đang mượn</option>
            <option value="returned">Đã trả</option>
            <option value="rejected">Bị từ chối</option>
          </select>
        </div>
      </div>

      <!-- Table Container -->
      <div class="card p-0 overflow-hidden">
        <table class="data-table">
          <thead>
            <tr>
              <th>Mã phiếu</th>
              <th>Ngày mượn</th>
              <th>Hạn trả</th>
              <th>Số sách</th>
              <th>Trạng thái</th>
              <th class="text-center">Hành động</th>
            </tr>
          </thead>
          <tbody id="borrow-history-table">
            <tr>
              <td colspan="6" class="text-center p-xl">
                <i class="fas fa-spinner fa-spin me-2"></i> Đang tải lịch sử
                mượn sách...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- Custom Confirmation Modal -->
    <div id="confirm-modal" class="modal-overlay">
      <div class="modal-container" style="max-width: 450px">
        <div class="modal-header" style="background: var(--danger)">
          <h3 id="confirm-modal-title">Xác nhận</h3>
          <button class="close-modal" id="close-confirm-modal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="text-center mb-lg">
            <i
              class="fas fa-exclamation-triangle"
              style="font-size: 3rem; color: var(--danger); opacity: 0.5"
            ></i>
          </div>
          <p id="confirm-modal-message" class="text-center"></p>
        </div>
        <div class="modal-footer" style="justify-content: center">
          <button class="btn btn-outline btn-sm" id="btn-confirm-cancel">
            Hủy bỏ
          </button>
          <button class="btn btn-danger btn-sm" id="btn-confirm-action">
            Xác nhận xóa
          </button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
