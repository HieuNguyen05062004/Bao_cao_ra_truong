<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - SmartLibrary</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="admin-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <i class="fas fa-book-reader"></i>
          <span>SmartLib Admin</span>
          <button class="sidebar-toggle">
            <i class="fas fa-bars"></i>
          </button>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item active">
            <i class="fas fa-chart-line"></i> Dashboard
          </a>
          <a href="ql-sach.html" class="nav-item">
            <i class="fas fa-book"></i> Quản lý sách
          </a>
          <a href="ql-danh-muc.html" class="nav-item">
            <i class="fas fa-list"></i> Thể loại
          </a>
          <a href="ql-ban-doc.html" class="nav-item">
            <i class="fas fa-users"></i> Bạn đọc
          </a>
          <a href="ql-nhan-vien.html" class="nav-item">
            <i class="fas fa-user-shield"></i> Nhân viên
          </a>
          <a href="muon-tra.html" class="nav-item">
            <i class="fas fa-exchange-alt"></i> Mượn & Trả
          </a>
        </nav>
        <div class="sidebar-user">
          <div class="user-profile">
            <img
              src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff"
              alt="Avatar"
            />
            <span>Quản trị viên</span>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="top-header">
          <button class="sidebar-toggle" id="sidebar-toggle">
            <i class="fas fa-bars"></i>
          </button>
          <div class="header-search">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Tìm kiếm nhanh..." />
          </div>
          <div class="header-user">
            <div class="notifications">
              <i class="fas fa-bell"></i>
              <span class="badge">3</span>
            </div>
          </div>
        </header>

        <div class="dashboard-body">
          <h1 class="page-title">Tổng quan hệ thống</h1>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon blue"><i class="fas fa-book"></i></div>
              <div class="stat-info">
                <span class="stat-label">Tổng sách</span>
                <h2 class="stat-value" id="total-books">0</h2>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon green"><i class="fas fa-tags"></i></div>
              <div class="stat-info">
                <span class="stat-label">Tổng danh mục</span>
                <h2 class="stat-value" id="total-categories">0</h2>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon orange"><i class="fas fa-users"></i></div>
              <div class="stat-info">
                <span class="stat-label">Tổng bạn đọc</span>
                <h2 class="stat-value" id="total-readers">0</h2>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon red">
                <i class="fas fa-book-open-reader"></i>
              </div>
              <div class="stat-info">
                <span class="stat-label">Tổng sách đã mượn</span>
                <h2 class="stat-value" id="borrowed-books">0</h2>
              </div>
            </div>
          </div>

          <div class="recent-section">
            <div class="card">
              <div class="card-header">
                <h3>Phiếu mượn gần đây</h3>
                <a href="muon-tra.html" class="btn btn-sm btn-outline"
                  >Xem tất cả</a
                >
              </div>
              <div class="card-body">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Mã phiếu</th>
                      <th>Bạn đọc</th>
                      <th>Sách mượn</th>
                      <th>Ngày mượn</th>
                      <th>Hạn trả</th>
                      <th>Trạng thái</th>
                      <th>Hành động</th>
                    </tr>
                  </thead>
                  <tbody id="recent-borrows">
                    <!-- JS sẽ render dữ liệu ở đây -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
