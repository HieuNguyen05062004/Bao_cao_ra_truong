<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý danh mục - SmartLibrary</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="admin-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <i class="fas fa-book-reader"></i>
          <span>SmartLib Admin</span>
          <button class="sidebar-toggle">
            <i class="fas fa-bars"></i>
          </button>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item">
            <i class="fas fa-chart-line"></i> Dashboard
          </a>
          <a href="ql-sach.html" class="nav-item">
            <i class="fas fa-book"></i> Quản lý sách
          </a>
          <a href="ql-danh-muc.html" class="nav-item active">
            <i class="fas fa-list"></i> Thể loại
          </a>
          <a href="ql-ban-doc.html" class="nav-item">
            <i class="fas fa-users"></i> Bạn đọc
          </a>
          <a href="muon-tra.html" class="nav-item">
            <i class="fas fa-exchange-alt"></i> Mượn & Trả
          </a>
        </nav>
        <div class="sidebar-user">
          <div class="user-profile">
            <img
              src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff"
              alt="Avatar"
            />
            <span>Quản trị viên</span>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <!-- Header -->
        <header class="top-header">
          <div class="header-search">
            <i class="fas fa-search"></i>
            <input
              type="text"
              id="category-search"
              placeholder="Tìm kiếm danh mục..."
            />
          </div>
          <div class="header-user">
            <a href="Creat-danhmuc.html" class="btn btn-primary">
              <i class="fas fa-plus"></i> Thêm danh mục mới
            </a>
          </div>
        </header>

        <div class="dashboard-body">
          <div class="page-header">
            <h1 class="page-title">Danh mục sách</h1>
          </div>

          <!-- Category Table -->
          <div class="card">
            <div class="card-body">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Tên danh mục</th>
                    <th>Số lượng sách</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="category-list">
                  <!-- Dữ liệu danh mục sẽ render ở đây -->
                </tbody>
              </table>
              <div class="pagination" data-pagination-for="categories"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
  </body>
</html>
