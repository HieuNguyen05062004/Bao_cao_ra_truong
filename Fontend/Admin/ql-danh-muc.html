<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý danh mục - SmartLibrary</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="admin-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <i class="fas fa-book-reader"></i>
          <span>SmartLib Admin</span>
          <button class="sidebar-toggle">
            <i class="fas fa-bars"></i>
          </button>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item">
            <i class="fas fa-chart-line"></i> Dashboard
          </a>
          <a href="ql-sach.html" class="nav-item">
            <i class="fas fa-book"></i> Quản lý sách
          </a>
          <a href="ql-danh-muc.html" class="nav-item active">
            <i class="fas fa-list"></i> Thể loại
          </a>
          <a href="ql-ban-doc.html" class="nav-item">
            <i class="fas fa-users"></i> Bạn đọc
          </a>
          <a href="muon-tra.html" class="nav-item">
            <i class="fas fa-exchange-alt"></i> Mượn & Trả
          </a>
          <a href="bao-cao.html" class="nav-item">
            <i class="fas fa-file-alt"></i> Báo cáo
          </a>
        </nav>
        <div class="sidebar-user">
          <div class="user-profile">
            <img
              src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff"
              alt="Avatar"
            />
            <span>Quản trị viên</span>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <!-- Header -->
        <header class="top-header">
          <div class="header-search">
            <i class="fas fa-search"></i>
            <input
              type="text"
              id="category-search"
              placeholder="Tìm kiếm danh mục..."
            />
          </div>
          <div class="header-user">
            <button class="btn btn-primary" id="btn-add-category">
              <i class="fas fa-plus"></i> Thêm danh mục mới
            </button>
          </div>
        </header>

        <div class="dashboard-body">
          <div class="page-header">
            <h1 class="page-title">Danh mục sách</h1>
          </div>

          <!-- Category Table -->
          <div class="card">
            <div class="card-body">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Tên danh mục</th>
                    <th>Số lượng sách</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="category-list">
                  <!-- Dữ liệu danh mục sẽ render ở đây -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal Thêm/Sửa Danh mục -->
    <div class="modal-overlay" id="category-modal">
      <div class="modal-container modal-sm">
        <div class="modal-header">
          <h2 id="category-modal-title">Thêm danh mục mới</h2>
          <button class="close-modal-btn" data-modal-target="category-modal">
            &times;
          </button>
        </div>
        <form id="category-form">
          <input type="hidden" id="edit-category-id" />
          <div class="form-group">
            <label>Tên danh mục</label>
            <input
              type="text"
              id="form-category-name"
              required
              placeholder="VD: Công nghệ thông tin"
            />
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline close-modal-btn"
              data-modal-target="category-modal"
            >
              Hủy
            </button>
            <button
              type="submit"
              class="btn btn-primary"
              id="category-submit-button"
            >
              Lưu danh mục
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal Xem Chi Tiết Danh Mục -->
    <div class="modal-overlay" id="category-details-modal">
      <div class="modal-container modal-sm">
        <div class="modal-header">
          <h2>Chi tiết danh mục</h2>
          <button class="close-modal-btn" id="close-category-details-x">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <div class="detail-item">
            <label>Mã danh mục:</label> <span id="detail-category-id"></span>
          </div>
          <div class="detail-item">
            <label>Tên danh mục:</label> <span id="detail-category-name"></span>
          </div>
          <div class="detail-item">
            <label>Số sách hiện có:</label>
            <span id="detail-category-count"></span>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-primary"
            id="close-category-details-btn"
          >
            Đóng
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Xác nhận (Dùng chung) -->
    <div class="modal-overlay" id="confirm-modal">
      <div class="modal-container modal-sm">
        <div class="modal-header">
          <h2 id="confirm-modal-title">Xác nhận hành động</h2>
          <button class="close-modal-btn" data-modal-target="confirm-modal">
            &times;
          </button>
        </div>
        <div class="modal-body text-center">
          <div class="modal-icon-wrapper">
            <i class="fas fa-exclamation-triangle"></i>
          </div>
          <p id="confirm-modal-message"></p>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-outline close-modal-btn"
            data-modal-target="confirm-modal"
          >
            Hủy
          </button>
          <button type="button" class="btn btn-danger" id="confirm-action-btn">
            Xác nhận
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
  </body>
</html>
