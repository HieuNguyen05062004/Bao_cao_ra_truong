<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thêm nhân viên mới - SmartLibrary</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="admin-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <i class="fas fa-book-reader"></i>
          <span>SmartLib Admin</span>
          <button class="sidebar-toggle"><i class="fas fa-bars"></i></button>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item"
            ><i class="fas fa-chart-line"></i> Dashboard</a
          >
          <a href="ql-sach.html" class="nav-item"
            ><i class="fas fa-book"></i> Quản lý sách</a
          >
          <a href="ql-danh-muc.html" class="nav-item"
            ><i class="fas fa-list"></i> Thể loại</a
          >
          <a href="ql-ban-doc.html" class="nav-item"
            ><i class="fas fa-users"></i> Bạn đọc</a
          >
          <a href="ql-nhan-vien.html" class="nav-item active"
            ><i class="fas fa-user-shield"></i> Nhân viên</a
          >
          <a href="muon-tra.html" class="nav-item"
            ><i class="fas fa-exchange-alt"></i> Mượn & Trả</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="top-header">
          <div class="page-title">
            <i class="fas fa-user-plus"></i> Thêm nhân viên mới
          </div>
          <div class="header-user">
            <a href="ql-nhan-vien.html" class="btn btn-outline"
              ><i class="fas fa-arrow-left"></i> Quay lại</a
            >
          </div>
        </header>

        <div class="dashboard-body">
          <div class="card">
            <div class="card-body">
              <form id="staff-form">
                <input type="hidden" id="edit-staff-id" />
                <div class="form-row">
                  <div class="form-group">
                    <label>Mật khẩu</label>
                    <input
                      type="password"
                      id="form-staff-password"
                      placeholder="********"
                      required
                    />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Họ và tên</label>
                    <input
                      type="text"
                      id="form-staff-name"
                      placeholder="Nhập tên đầy đủ..."
                      required
                    />
                  </div>
                  <div class="form-group">
                    <label>Email</label>
                    <input
                      type="email"
                      id="form-staff-email"
                      placeholder="example@gmail.com"
                      required
                    />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Quyền hạn</label>
                    <select id="form-staff-role" required>
                      <option value="">-- Chọn quyền --</option>
                      <option value="Admin">Quản trị viên (Admin)</option>
                      <option value="Staff">Thủ thư (Staff)</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>Ảnh đại diện</label>
                    <input type="file" id="form-staff-img" accept="image/*" />
                  </div>
                </div>
                <div
                  class="form-actions"
                  style="
                    display: flex;
                    gap: 10px;
                    justify-content: flex-end;
                    margin-top: 20px;
                  "
                >
                  <a href="ql-nhan-vien.html" class="btn btn-outline">Hủy bỏ</a>
                  <button type="submit" class="btn btn-primary">
                    Thêm nhân viên
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="confirm-modal" class="modal-overlay">
      <div class="modal-container modal-sm">
        <div class="modal-header">
          <h2 id="confirm-modal-title">Xác nhận</h2>
          <button class="close-modal-btn">&times;</button>
        </div>
        <div class="modal-body text-center">
          <p id="confirm-modal-message"></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline close-modal-btn">Hủy</button>
          <button class="btn btn-primary" id="confirm-action-btn">
            Đồng ý
          </button>
        </div>
      </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="app.js"></script>
  </body>
</html>
