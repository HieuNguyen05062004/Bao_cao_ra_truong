<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết nhân viên - SmartLibrary</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="admin-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <i class="fas fa-book-reader"></i>
          <span>SmartLib Admin</span>
          <button class="sidebar-toggle"><i class="fas fa-bars"></i></button>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item"
            ><i class="fas fa-chart-line"></i> Dashboard</a
          >
          <a href="ql-sach.html" class="nav-item"
            ><i class="fas fa-book"></i> Quản lý sách</a
          >
          <a href="ql-danh-muc.html" class="nav-item"
            ><i class="fas fa-list"></i> Thể loại</a
          >
          <a href="ql-ban-doc.html" class="nav-item"
            ><i class="fas fa-users"></i> Bạn đọc</a
          >
          <a href="ql-nhan-vien.html" class="nav-item active"
            ><i class="fas fa-user-shield"></i> Nhân viên</a
          >
          <a href="muon-tra.html" class="nav-item"
            ><i class="fas fa-exchange-alt"></i> Mượn & Trả</a
          >
        </nav>
        <div class="sidebar-user">
          <div class="user-profile">
            <img
              src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff"
              alt="Avatar"
            />
            <span>Quản trị viên</span>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="top-header">
          <button class="sidebar-toggle" id="sidebar-toggle">
            <i class="fas fa-bars"></i>
          </button>
          <div class="page-title">
            <i class="fas fa-user-shield"></i> Chi tiết nhân viên
          </div>
          <div class="header-user">
            <a href="ql-nhan-vien.html" class="btn btn-outline"
              ><i class="fas fa-arrow-left"></i> Quay lại</a
            >
          </div>
        </header>

        <div class="dashboard-body detail-page">
          <div class="detail-hero">
            <div class="detail-hero-title">
              <span class="detail-hero-icon"
                ><i class="fas fa-user-gear"></i
              ></span>
              <div>
                <h1 id="display-header-title">Chi tiết nhân viên</h1>
                <p>Thông tin tài khoản nội bộ, quyền hạn và ngày tạo hồ sơ.</p>
              </div>
            </div>
            <div class="detail-hero-actions">
              <a href="ql-nhan-vien.html" class="btn btn-outline"
                ><i class="fas fa-arrow-left"></i> Danh sách</a
              >
            </div>
          </div>

          <div class="card detail-shell">
            <div class="card-body">
              <div class="detail-layout">
                <div class="detail-media">
                  <img
                    id="staff-detail-img"
                    src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff"
                    alt="Ảnh nhân viên"
                    class="avatar"
                  />
                  <span class="detail-media-caption">Ảnh đại diện</span>
                </div>
                <div>
                  <div class="detail-section-title">
                    <i class="fas fa-circle-info"></i> Thông tin tài khoản
                  </div>
                  <div class="detail-info-grid">
                    <div class="detail-field">
                      <label
                        ><i class="fas fa-id-badge"></i> Mã nhân viên</label
                      >
                      <span id="detail-staff-id">--</span>
                    </div>
                    <div class="detail-field">
                      <label><i class="fas fa-user-gear"></i> Quyền hạn</label>
                      <span id="detail-staff-role" class="badge badge-primary"
                        >--</span
                      >
                    </div>
                    <div class="detail-field">
                      <label><i class="fas fa-user"></i> Họ và tên</label>
                      <span id="detail-staff-name">--</span>
                    </div>
                    <div class="detail-field">
                      <label><i class="fas fa-envelope"></i> Email</label>
                      <span id="detail-staff-email">--</span>
                    </div>
                    <div class="detail-field full">
                      <label><i class="fas fa-lock"></i> Mật khẩu</label>
                      <div class="detail-password-row">
                        <input
                          type="password"
                          id="detail-staff-password"
                          value="••••••••"
                          readonly
                        />
                        <button
                          type="button"
                          id="toggle-password-btn"
                          class="btn btn-sm btn-outline"
                        >
                          <i class="fas fa-eye"></i>
                        </button>
                      </div>
                    </div>
                    <div class="detail-field full">
                      <label
                        ><i class="fas fa-calendar-plus"></i> Ngày tạo</label
                      >
                      <span id="detail-staff-created">--</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
