<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý nhân viên - SmartLibrary</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="admin-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <i class="fas fa-book-reader"></i>
          <span>SmartLib Admin</span>
          <button class="sidebar-toggle"><i class="fas fa-bars"></i></button>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item"
            ><i class="fas fa-chart-line"></i> Dashboard</a
          >
          <a href="ql-sach.html" class="nav-item"
            ><i class="fas fa-book"></i> Quản lý sách</a
          >
          <a href="ql-danh-muc.html" class="nav-item"
            ><i class="fas fa-list"></i> Thể loại</a
          >
          <a href="ql-ban-doc.html" class="nav-item"
            ><i class="fas fa-users"></i> Bạn đọc</a
          >
          <a href="ql-nhan-vien.html" class="nav-item active"
            ><i class="fas fa-user-shield"></i> Nhân viên</a
          >
          <a href="muon-tra.html" class="nav-item"
            ><i class="fas fa-exchange-alt"></i> Mượn & Trả</a
          >
          <a href="bao-cao.html" class="nav-item"
            ><i class="fas fa-file-alt"></i> Báo cáo</a
          >
        </nav>
        <div class="sidebar-user">
          <div class="user-profile">
            <img
              src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff"
              alt="Avatar"
            />
            <span>Quản trị viên</span>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="top-header">
          <button class="sidebar-toggle" id="sidebar-toggle">
            <i class="fas fa-bars"></i>
          </button>
          <div class="header-search">
            <i class="fas fa-search"></i>
            <input
              type="text"
              id="staff-search"
              placeholder="Tìm tên, username, email nhân viên..."
            />
          </div>
          <div class="header-user">
            <button
              class="btn btn-primary"
              id="btn-add-staff"
              onclick="app.openStaffModal()"
            >
              <i class="fas fa-user-plus"></i> Thêm nhân viên
            </button>
          </div>
        </header>

        <div class="dashboard-body">
          <div class="page-header">
            <h1 class="page-title">Quản lý tài khoản nhân viên</h1>
          </div>

          <div class="card">
            <div class="card-body">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Ảnh</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Quyền hạn</th>
                    <th>Ngày tạo</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="staff-list">
                  <!-- Dữ liệu sẽ render từ app.js -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal Thêm/Sửa Nhân viên -->
    <div class="modal-overlay" id="staff-modal">
      <div class="modal-container">
        <div class="modal-header">
          <h2 id="staff-modal-title">Thêm nhân viên mới</h2>
          <button class="close-modal-btn" data-modal-target="staff-modal">
            &times;
          </button>
        </div>
        <form id="staff-form">
          <input type="hidden" id="edit-staff-id" />
          <div class="form-row">
            <div class="form-group">
              <label id="label-password">Mật khẩu</label>
              <input
                type="password"
                id="form-staff-password"
                placeholder="********"
              />
              <small
                id="password-help"
                style="
                  display: none;
                  color: var(--text-light);
                  font-size: 0.75rem;
                "
                >Để trống nếu không muốn đổi mật khẩu</small
              >
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Họ và tên</label>
              <input
                type="text"
                id="form-staff-name"
                placeholder="Nhập tên đầy đủ..."
              />
            </div>
            <div class="form-group">
              <label>Email</label>
              <input
                type="email"
                id="form-staff-email"
                placeholder="example@gmail.com"
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Quyền hạn</label>
              <select id="form-staff-role">
                <option value="">-- Chọn quyền --</option>
                <option value="Admin">Quản trị viên (Admin)</option>
                <option value="Staff">Thủ thư (Staff)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Ảnh đại diện</label>
              <input type="file" id="form-staff-img" accept="image/*" />
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline close-modal-btn"
              data-modal-target="staff-modal"
            >
              Hủy
            </button>
            <button type="submit" class="btn btn-primary">Lưu tài khoản</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal Xác nhận chung -->
    <div class="modal-overlay" id="confirm-modal">
      <div class="modal-container modal-sm">
        <div class="modal-header">
          <h2 id="confirm-modal-title">Xác nhận hành động</h2>
          <button class="close-modal-btn" data-modal-target="confirm-modal">
            &times;
          </button>
        </div>
        <div class="modal-body text-center">
          <div class="modal-icon-wrapper">
            <i class="fas fa-exclamation-triangle"></i>
          </div>
          <p id="confirm-modal-message">
            Bạn có chắc chắn muốn thực hiện hành động này?
          </p>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-outline"
            data-modal-target="confirm-modal"
          >
            Hủy
          </button>
          <button type="button" class="btn btn-danger" id="confirm-action-btn">
            Xác nhận
          </button>
        </div>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="app.js"></script>
  </body>
</html>
