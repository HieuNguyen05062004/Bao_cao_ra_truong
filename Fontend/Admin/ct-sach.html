<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sách - SmartLibrary</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="admin-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <i class="fas fa-book-reader"></i>
          <span>SmartLib Admin</span>
          <button class="sidebar-toggle"><i class="fas fa-bars"></i></button>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item"
            ><i class="fas fa-chart-line"></i> Dashboard</a
          >
          <a href="ql-sach.html" class="nav-item active"
            ><i class="fas fa-book"></i> Quản lý sách</a
          >
          <a href="ql-danh-muc.html" class="nav-item"
            ><i class="fas fa-list"></i> Thể loại</a
          >
          <a href="ql-ban-doc.html" class="nav-item"
            ><i class="fas fa-users"></i> Bạn đọc</a
          >
          <a href="muon-tra.html" class="nav-item"
            ><i class="fas fa-exchange-alt"></i> Mượn & Trả</a
          >
        </nav>
        <div class="sidebar-user">
          <div class="user-profile">
            <img
              src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff"
              alt="Avatar"
            />
            <span>Quản trị viên</span>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="top-header">
          <div class="page-title">
            <i class="fas fa-info-circle"></i> Chi tiết sách
          </div>
          <div class="header-user">
            <a href="ql-sach.html" class="btn btn-outline"
              ><i class="fas fa-arrow-left"></i> Quay lại</a
            >
          </div>
        </header>

        <div class="dashboard-body detail-page">
          <div class="detail-hero">
            <div class="detail-hero-title">
              <span class="detail-hero-icon"
                ><i class="fas fa-book-open"></i
              ></span>
              <div>
                <h1 id="detail-title">Chi tiết sách</h1>
                <p>Thông tin đầu sách, phân loại, trạng thái kho và ảnh bìa.</p>
              </div>
            </div>
            <div class="detail-hero-actions">
              <a href="ql-sach.html" class="btn btn-outline"
                ><i class="fas fa-arrow-left"></i> Danh sách</a
              >
              <a id="edit-link" href="#" class="btn btn-edit"
                ><i class="fas fa-edit"></i> Chỉnh sửa</a
              >
            </div>
          </div>

          <div class="card detail-shell">
            <div class="card-body">
              <div class="detail-layout">
                <div class="detail-media">
                  <img id="detail-img" src="" alt="Ảnh bìa sách" />
                  <span class="detail-media-caption">Ảnh bìa</span>
                </div>
                <div>
                  <div class="detail-section-title">
                    <i class="fas fa-circle-info"></i> Thông tin sách
                  </div>
                  <div class="detail-info-grid">
                    <div class="detail-field">
                      <label><i class="fas fa-barcode"></i> Mã sách</label>
                      <span id="detail-id">--</span>
                    </div>
                    <div class="detail-field">
                      <label><i class="fas fa-signal"></i> Trạng thái</label>
                      <span id="detail-status" class="badge">--</span>
                    </div>
                    <div class="detail-field">
                      <label><i class="fas fa-user-pen"></i> Tác giả</label>
                      <span id="detail-author">--</span>
                    </div>
                    <div class="detail-field">
                      <label
                        ><i class="fas fa-building"></i> Nhà xuất bản</label
                      >
                      <span id="detail-publisher">--</span>
                    </div>
                    <div class="detail-field">
                      <label
                        ><i class="fas fa-calendar-days"></i> Năm xuất
                        bản</label
                      >
                      <span id="detail-year">--</span>
                    </div>
                    <div class="detail-field">
                      <label
                        ><i class="fas fa-boxes-stacked"></i> Số lượng</label
                      >
                      <span id="detail-stock">--</span>
                    </div>
                    <div class="detail-field full">
                      <label><i class="fas fa-tags"></i> Thể loại</label>
                      <span id="detail-category">--</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="detail-actions-bar">
              <a id="edit-link-footer" href="#" class="btn btn-edit"
                ><i class="fas fa-edit"></i> Chỉnh sửa sách</a
              >
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const syncEditLink = () => {
          const source = document.getElementById("edit-link");
          const target = document.getElementById("edit-link-footer");
          if (source && target) target.href = source.href;
        };
        setTimeout(syncEditLink, 400);
      });
    </script>
  </body>
</html>
