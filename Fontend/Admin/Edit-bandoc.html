<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chỉnh sửa bạn đọc - SmartLibrary</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="admin-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <i class="fas fa-book-reader"></i>
          <span>SmartLib Admin</span>
          <button class="sidebar-toggle"><i class="fas fa-bars"></i></button>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item"
            ><i class="fas fa-chart-line"></i> Dashboard</a
          >
          <a href="ql-sach.html" class="nav-item"
            ><i class="fas fa-book"></i> Quản lý sách</a
          >
          <a href="ql-danh-muc.html" class="nav-item"
            ><i class="fas fa-list"></i> Thể loại</a
          >
          <a href="ql-ban-doc.html" class="nav-item active"
            ><i class="fas fa-users"></i> Bạn đọc</a
          >
          <a href="muon-tra.html" class="nav-item"
            ><i class="fas fa-exchange-alt"></i> Mượn & Trả</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="top-header">
          <div class="page-title">
            <i class="fas fa-user-edit"></i> Chỉnh sửa thông tin bạn đọc
          </div>
          <div class="header-user">
            <a href="ql-ban-doc.html" class="btn btn-outline"
              ><i class="fas fa-arrow-left"></i> Quay lại</a
            >
          </div>
        </header>

        <div class="dashboard-body">
          <div class="card">
            <div class="card-body">
              <form id="reader-form">
                <input type="hidden" id="edit-reader-flag" />
                <div class="form-row">
                  <div class="form-group">
                    <label>Mã bạn đọc</label>
                    <input
                      type="text"
                      id="form-reader-id"
                      readonly
                      class="bg-light"
                    />
                  </div>
                  <div class="form-group">
                    <label>Họ tên</label>
                    <input type="text" id="form-reader-name" required />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="form-reader-email" required />
                  </div>
                  <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text" id="form-reader-phone" required />
                  </div>
                </div>
                <div class="form-group" id="password-group">
                  <label>Mật khẩu mới (để trống nếu không đổi)</label>
                  <input
                    type="password"
                    id="form-reader-password"
                    placeholder="Nhập mật khẩu mới..."
                  />
                </div>
                <div class="form-group">
                  <label>Địa chỉ</label>
                  <input type="text" id="form-reader-address" />
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Giới tính</label>
                    <select id="form-reader-gender">
                      <option value="Nam">Nam</option>
                      <option value="Nữ">Nữ</option>
                      <option value="Khác">Khác</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>Ngày sinh</label>
                    <input type="date" id="form-reader-dob" required />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Trạng thái</label>
                    <select id="form-reader-status">
                      <option value="Hoạt động">Hoạt động</option>
                      <option value="Đang khóa">Đang khóa</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>Thay đổi ảnh đại diện</label>
                    <input type="file" id="form-reader-img" accept="image/*" />
                  </div>
                </div>
                <div
                  class="form-actions"
                  style="
                    display: flex;
                    gap: 10px;
                    justify-content: flex-end;
                    margin-top: 20px;
                  "
                >
                  <a href="ql-ban-doc.html" class="btn btn-outline">Hủy bỏ</a>
                  <button
                    type="submit"
                    class="btn btn-primary"
                    id="reader-submit-button"
                  >
                    Lưu thay đổi
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
    <div id="confirm-modal" class="modal-overlay"></div>
    <div id="toast-container" class="toast-container"></div>
    <script src="app.js"></script>
  </body>
</html>
