<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chỉnh sửa danh mục - SmartLibrary</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="admin-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <i class="fas fa-book-reader"></i>
          <span>SmartLib Admin</span>
          <button class="sidebar-toggle"><i class="fas fa-bars"></i></button>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item"
            ><i class="fas fa-chart-line"></i> Dashboard</a
          >
          <a href="ql-sach.html" class="nav-item"
            ><i class="fas fa-book"></i> Quản lý sách</a
          >
          <a href="ql-danh-muc.html" class="nav-item active"
            ><i class="fas fa-list"></i> Thể loại</a
          >
          <a href="ql-ban-doc.html" class="nav-item"
            ><i class="fas fa-users"></i> Bạn đọc</a
          >
          <a href="muon-tra.html" class="nav-item"
            ><i class="fas fa-exchange-alt"></i> Mượn & Trả</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="top-header">
          <div class="page-title">
            <i class="fas fa-edit"></i> Chỉnh sửa danh mục
          </div>
          <div class="header-user">
            <a href="ql-danh-muc.html" class="btn btn-outline"
              ><i class="fas fa-arrow-left"></i> Quay lại</a
            >
          </div>
        </header>

        <div class="dashboard-body">
          <div class="card">
            <div class="card-body">
              <form id="category-form">
                <input type="hidden" id="edit-category-id" />
                <div class="form-group">
                  <label>Tên danh mục</label>
                  <input type="text" id="form-category-name" required />
                </div>
                <div
                  class="form-actions"
                  style="
                    display: flex;
                    gap: 10px;
                    justify-content: flex-end;
                    margin-top: 20px;
                  "
                >
                  <a href="ql-danh-muc.html" class="btn btn-outline">Hủy bỏ</a>
                  <button
                    type="submit"
                    class="btn btn-primary"
                    id="category-submit-button"
                  >
                    Lưu thay đổi
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="confirm-modal" class="modal-overlay">
      <div class="modal-container modal-sm">
        <div class="modal-header">
          <h2 id="confirm-modal-title">Xác nhận</h2>
          <button class="close-modal-btn">&times;</button>
        </div>
        <div class="modal-body text-center">
          <p id="confirm-modal-message"></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline close-modal-btn">Hủy</button>
          <button class="btn btn-primary" id="confirm-action-btn">
            Xác nhận
          </button>
        </div>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="app.js"></script>
  </body>
</html>
