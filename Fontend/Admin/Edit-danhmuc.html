<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chỉnh sửa danh mục - SmartLibrary</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="admin-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <i class="fas fa-book-reader"></i>
          <span>SmartLib Admin</span>
          <button class="sidebar-toggle"><i class="fas fa-bars"></i></button>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item"
            ><i class="fas fa-chart-line"></i> Dashboard</a
          >
          <a href="ql-sach.html" class="nav-item"
            ><i class="fas fa-book"></i> Quản lý sách</a
          >
          <a href="ql-danh-muc.html" class="nav-item active"
            ><i class="fas fa-list"></i> Thể loại</a
          >
          <a href="ql-ban-doc.html" class="nav-item"
            ><i class="fas fa-users"></i> Bạn đọc</a
          >
          <a href="muon-tra.html" class="nav-item"
            ><i class="fas fa-exchange-alt"></i> Mượn & Trả</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="top-header">
          <div class="page-title">
            <i class="fas fa-edit"></i> Chỉnh sửa danh mục
          </div>
          <div class="header-user">
            <a href="ql-danh-muc.html" class="btn btn-outline"
              ><i class="fas fa-arrow-left"></i> Quay lại</a
            >
          </div>
        </header>

        <div class="dashboard-body form-page">
          <div class="card form-shell">
            <div class="form-hero">
              <div class="form-hero-title">
                <span class="form-hero-icon"
                  ><i class="fas fa-pen-to-square"></i
                ></span>
                <div>
                  <h1>Chỉnh sửa danh mục</h1>
                  <p>
                    Cập nhật tên danh mục để quản lý bộ sưu tập sách chính xác.
                  </p>
                </div>
              </div>
              <span class="form-badge"
                ><i class="fas fa-shield-halved"></i> Kiểm tra trước khi
                lưu</span
              >
            </div>
            <div class="card-body">
              <form id="category-form">
                <input type="hidden" id="edit-category-id" />
                <section class="form-section">
                  <div class="section-title">
                    <i class="fas fa-folder-open"></i> Thông tin danh mục
                  </div>
                  <div class="form-group">
                    <label class="field-label"
                      ><i class="fas fa-tag"></i> Tên danh mục</label
                    >
                    <input
                      type="text"
                      id="form-category-name"
                      required
                      placeholder="VD: Công nghệ thông tin"
                    />
                  </div>
                </section>
                <div class="form-actions">
                  <a href="ql-danh-muc.html" class="btn btn-outline"
                    ><i class="fas fa-xmark"></i> Hủy bỏ</a
                  >
                  <button
                    type="submit"
                    class="btn btn-primary"
                    id="category-submit-button"
                  >
                    <i class="fas fa-floppy-disk"></i> Lưu thay đổi
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="confirm-modal" class="modal-overlay"></div>
    <div id="toast-container" class="toast-container"></div>
    <script src="app.js"></script>
  </body>
</html>
