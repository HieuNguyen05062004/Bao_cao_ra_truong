<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thêm sách mới - SmartLibrary</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="admin-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <i class="fas fa-book-reader"></i>
          <span>SmartLib Admin</span>
          <button class="sidebar-toggle"><i class="fas fa-bars"></i></button>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item"
            ><i class="fas fa-chart-line"></i> Dashboard</a
          >
          <a href="ql-sach.html" class="nav-item active"
            ><i class="fas fa-book"></i> Quản lý sách</a
          >
          <a href="ql-danh-muc.html" class="nav-item"
            ><i class="fas fa-list"></i> Thể loại</a
          >
          <a href="ql-ban-doc.html" class="nav-item"
            ><i class="fas fa-users"></i> Bạn đọc</a
          >
          <a href="muon-tra.html" class="nav-item"
            ><i class="fas fa-exchange-alt"></i> Mượn & Trả</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="top-header">
          <div class="page-title">
            <i class="fas fa-plus-circle"></i> Thêm sách mới
          </div>
          <div class="header-user">
            <a href="ql-sach.html" class="btn btn-outline"
              ><i class="fas fa-arrow-left"></i> Quay lại</a
            >
          </div>
        </header>

        <div class="dashboard-body">
          <div class="card">
            <div class="card-body">
              <form id="book-form">
                <input type="hidden" id="edit-id" value="" />
                <div class="form-group">
                  <label>Tên sách</label>
                  <input
                    type="text"
                    id="form-title"
                    required
                    placeholder="Nhập tên sách..."
                  />
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Tác giả</label>
                    <input
                      type="text"
                      id="form-author"
                      required
                      placeholder="Tên tác giả"
                    />
                  </div>
                  <div class="form-group">
                    <div
                      style="
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        margin-bottom: 5px;
                      "
                    >
                      <label style="margin-bottom: 0">Thể loại</label>
                      <button
                        type="button"
                        class="btn btn-sm btn-outline"
                        id="add-category-field"
                        title="Thêm thể loại"
                      >
                        <i class="fas fa-plus"></i>
                      </button>
                    </div>
                    <div id="category-fields-container">
                      <select id="form-category" class="form-select">
                        <option value="">-- Chọn thể loại --</option>
                        <option value="CNTT">CNTT</option>
                        <option value="Kinh tế">Kinh tế</option>
                        <option value="Văn học">Văn học</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Nhà xuất bản</label>
                    <input
                      type="text"
                      id="form-publisher"
                      placeholder="Tên nhà xuất bản"
                    />
                  </div>
                  <div class="form-group">
                    <label>Năm xuất bản</label>
                    <input
                      type="number"
                      id="form-publish-year"
                      min="1000"
                      max="2100"
                      placeholder="Năm"
                    />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Số lượng</label>
                    <input
                      type="number"
                      id="form-stock"
                      min="0"
                      required
                      value="1"
                    />
                  </div>
                  <div class="form-group">
                    <label>Ảnh bìa</label>
                    <input type="file" id="form-img" accept="image/*" />
                  </div>
                </div>
                <div class="form-group">
                  <label>Mô tả sách</label>
                  <textarea
                    id="form-description"
                    rows="5"
                    placeholder="Mô tả nội dung..."
                  ></textarea>
                </div>
                <div
                  class="form-actions"
                  style="
                    display: flex;
                    gap: 10px;
                    justify-content: flex-end;
                    margin-top: 20px;
                  "
                >
                  <a href="ql-sach.html" class="btn btn-outline">Hủy bỏ</a>
                  <button
                    type="submit"
                    class="btn btn-primary"
                    id="submit-button"
                  >
                    Thêm sách
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="confirm-modal" class="modal-overlay">
      <div class="modal-container modal-sm">
        <div class="modal-header">
          <h2 id="confirm-modal-title">Xác nhận</h2>
          <button class="close-modal-btn">&times;</button>
        </div>
        <div class="modal-body text-center">
          <p id="confirm-modal-message"></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline close-modal-btn">Hủy</button>
          <button class="btn btn-primary" id="confirm-action-btn">
            Đồng ý
          </button>
        </div>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="app.js"></script>
  </body>
</html>
