<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý bạn đọc - SmartLibrary</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="admin-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <i class="fas fa-book-reader"></i>
          <span>SmartLib Admin</span>
          <button class="sidebar-toggle">
            <i class="fas fa-bars"></i>
          </button>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item">
            <i class="fas fa-chart-line"></i> Dashboard
          </a>
          <a href="ql-sach.html" class="nav-item">
            <i class="fas fa-book"></i> Quản lý sách
          </a>
          <a href="ql-danh-muc.html" class="nav-item">
            <i class="fas fa-list"></i> Thể loại
          </a>
          <a href="ql-ban-doc.html" class="nav-item active">
            <i class="fas fa-users"></i> Bạn đọc
          </a>
          <a href="muon-tra.html" class="nav-item">
            <i class="fas fa-exchange-alt"></i> Mượn & Trả
          </a>
          <a href="bao-cao.html" class="nav-item">
            <i class="fas fa-file-alt"></i> Báo cáo
          </a>
        </nav>
        <div class="sidebar-user">
          <div class="user-profile">
            <img
              src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff"
              alt="Avatar"
            />
            <span>Quản trị viên</span>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <!-- Header -->
        <header class="top-header">
          <div class="header-search">
            <i class="fas fa-search"></i>
            <input
              type="text"
              id="reader-search"
              placeholder="Tìm tên, email, số điện thoại..."
            />
          </div>
          <div class="header-user">
            <button class="btn btn-primary" id="btn-add-reader">
              <i class="fas fa-plus"></i> Thêm bạn đọc mới
            </button>
          </div>
        </header>

        <div class="dashboard-body">
          <div class="page-header">
            <h1 class="page-title">Quản lý danh sách bạn đọc</h1>
          </div>

          <!-- Reader Table -->
          <div class="card">
            <div class="card-body">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Mã bạn đọc</th>
                    <th>Họ tên</th>
                    <th>Giới tính</th>
                    <th>SĐT</th>
                    <th>Email</th>
                    <th>Đang mượn</th>
                    <th>Quá hạn</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="reader-list">
                  <!-- Dữ liệu sẽ được render từ app.js -->
                </tbody>
              </table>

              <div class="pagination">
                <span>Hiển thị kết quả từ hệ thống</span>
                <div class="pages">
                  <button class="btn btn-sm btn-outline">
                    <i class="fas fa-chevron-left"></i>
                  </button>
                  <button class="btn btn-sm btn-outline active">1</button>
                  <button class="btn btn-sm btn-outline">2</button>
                  <button class="btn btn-sm btn-outline">
                    <i class="fas fa-chevron-right"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal Thêm/Sửa Bạn Đọc -->
    <div class="modal-overlay" id="reader-modal">
      <div class="modal-container">
        <div class="modal-header">
          <h2 id="reader-modal-title">Thêm bạn đọc mới</h2>
          <button class="close-modal-btn" data-modal-target="reader-modal">
            &times;
          </button>
        </div>
        <form id="reader-form">
          <input type="hidden" id="edit-reader-flag" />
          <div class="form-row">
            <div class="form-group">
              <label>Mã bạn đọc</label>
              <input
                type="text"
                id="form-reader-id"
                required
                placeholder="VD: BD001"
              />
            </div>
            <div class="form-group">
              <label>Họ tên</label>
              <input
                type="text"
                id="form-reader-name"
                required
                placeholder="Nhập họ tên đầy đủ..."
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Email</label>
              <input
                type="email"
                id="form-reader-email"
                required
                placeholder="example@gmail.com"
              />
            </div>
            <div class="form-group">
              <label>Số điện thoại</label>
              <input
                type="text"
                id="form-reader-phone"
                required
                placeholder="09xxxxxxx"
              />
            </div>
          </div>
          <div class="form-group" id="password-group">
            <label>Mật khẩu đăng nhập</label>
            <input
              type="password"
              id="form-reader-password"
              placeholder="Nhập mật khẩu cho bạn đọc..."
            />
          </div>
          <div class="form-group">
            <label>Địa chỉ</label>
            <input
              type="text"
              id="form-reader-address"
              placeholder="Nhập địa chỉ cư trú..."
            />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Giới tính</label>
              <select id="form-reader-gender">
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
                <option value="Khác">Khác</option>
              </select>
            </div>
            <div class="form-group">
              <label>Ngày sinh</label>
              <input type="date" id="form-reader-dob" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Trạng thái</label>
              <select id="form-reader-status">
                <option value="Hoạt động">Hoạt động</option>
                <option value="Đang khóa">Đang khóa</option>
              </select>
            </div>
            <div class="form-group">
              <label>Ảnh đại diện</label>
              <input type="file" id="form-reader-img" accept="image/*" />
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline close-modal-btn"
              data-modal-target="reader-modal"
            >
              Hủy
            </button>
            <button
              type="submit"
              class="btn btn-primary"
              id="reader-submit-button"
            >
              Lưu thông tin
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal Xem Chi Tiết Bạn Đọc -->
    <div class="modal-overlay" id="reader-details-modal">
      <div class="modal-container">
        <div class="modal-header">
          <h2>Thông tin chi tiết bạn đọc</h2>
          <button class="close-modal-btn" id="close-reader-details-x">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <div class="book-details-grid">
            <div class="detail-img-container text-center">
              <img
                id="reader-detail-img"
                src=""
                alt="Avatar"
                class="detail-img"
                style="
                  border-radius: 50%;
                  width: 150px;
                  height: 150px;
                  object-fit: cover;
                "
              />
            </div>
            <div class="detail-info-container">
              <div class="detail-item">
                <label>Mã bạn đọc:</label> <span id="detail-reader-id"></span>
              </div>
              <div class="detail-item">
                <label>Họ tên:</label> <span id="detail-reader-name"></span>
              </div>
              <div class="detail-item">
                <label>Giới tính:</label>
                <span id="detail-reader-gender"></span>
              </div>
              <div class="detail-item">
                <label>Ngày sinh:</label> <span id="detail-reader-dob"></span>
              </div>
              <div class="detail-item">
                <label>Email:</label> <span id="detail-reader-email"></span>
              </div>
              <div class="detail-item">
                <label>SĐT:</label> <span id="detail-reader-phone"></span>
              </div>
              <div class="detail-item">
                <label>Địa chỉ:</label> <span id="detail-reader-address"></span>
              </div>
              <div class="detail-item">
                <label>Trạng thái:</label>
                <span id="detail-reader-status" class="badge"></span>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-primary"
            id="close-reader-details-btn"
          >
            Đóng
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Xác nhận (Dùng chung) -->
    <div class="modal-overlay" id="confirm-modal">
      <div class="modal-container modal-sm">
        <div class="modal-header">
          <h2 id="confirm-modal-title">Xác nhận</h2>
          <button class="close-modal-btn" data-modal-target="confirm-modal">
            &times;
          </button>
        </div>
        <div class="modal-body text-center">
          <div class="modal-icon-wrapper">
            <i class="fas fa-exclamation-triangle"></i>
          </div>
          <p id="confirm-modal-message"></p>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-outline close-modal-btn"
            data-modal-target="confirm-modal"
          >
            Hủy
          </button>
          <button type="button" class="btn btn-danger" id="confirm-action-btn">
            Xác nhận
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
    <script>
      function showError(input, message) {
        const parent = input.closest(".form-group");
        let error = parent.querySelector(".error-msg");
        if (!error) {
          error = document.createElement("span");
          error.className = "error-msg";
          error.style.color = "red";
          error.style.fontSize = "0.8rem";
          error.style.marginTop = "5px";
          error.style.display = "block";
          parent.appendChild(error);
        }
        error.textContent = message;
        input.style.borderColor = "red";
      }

      function clearError(input) {
        const parent = input.closest(".form-group");
        const error = parent.querySelector(".error-msg");
        if (error) error.remove();
        input.style.borderColor = "";
      }

      const readerForm = document.getElementById("reader-form");
      const rFields = {
        name: document.getElementById("form-reader-name"),
        phone: document.getElementById("form-reader-phone"),
        gender: document.getElementById("form-reader-gender"),
        dob: document.getElementById("form-reader-dob"),
        email: document.getElementById("form-reader-email"),
        address: document.getElementById("form-reader-address"),
        img: document.getElementById("form-reader-img"),
      };

      function validateReaderForm() {
        let isValid = true;

        if (
          rFields.name.value.trim().length < 5 ||
          rFields.name.value.trim().length > 20
        ) {
          showError(
            rFields.name,
            "Họ và tên không được để trống và phải từ 5 - 20 ký tự.",
          );
          isValid = false;
        } else {
          clearError(rFields.name);
        }

        if (!/^\d{10}$/.test(rFields.phone.value.trim())) {
          showError(
            rFields.phone,
            "Số điện thoại phải nhập đúng đủ 10 chữ số.",
          );
          isValid = false;
        } else {
          clearError(rFields.phone);
        }

        if (!rFields.gender.value) {
          showError(rFields.gender, "Vui lòng chọn giới tính.");
          isValid = false;
        } else {
          clearError(rFields.gender);
        }

        if (!rFields.dob.value) {
          showError(rFields.dob, "Vui lòng chọn ngày sinh.");
          isValid = false;
        } else {
          clearError(rFields.dob);
        }

        if (!/^[^\s@]+@gmail\.com$/.test(rFields.email.value.trim())) {
          showError(
            rFields.email,
            "Email không hợp lệ (Phải đúng định dạng @gmail.com).",
          );
          isValid = false;
        } else {
          clearError(rFields.email);
        }

        if (
          rFields.address.value.trim().length < 5 ||
          rFields.address.value.trim().length > 100
        ) {
          showError(
            rFields.address,
            "Địa chỉ không được để trống và phải từ 5 - 100 ký tự.",
          );
          isValid = false;
        } else {
          clearError(rFields.address);
        }

        if (
          !document.getElementById("edit-reader-flag").value &&
          rFields.img.files.length === 0
        ) {
          showError(rFields.img, "Vui lòng tải lên ảnh đại diện bạn đọc.");
          isValid = false;
        } else {
          clearError(rFields.img);
        }

        return isValid;
      }

      Object.values(rFields).forEach((field) => {
        if (field) {
          field.addEventListener("input", () => {
            if (
              field.id === "form-reader-name" &&
              field.value.trim().length >= 5 &&
              field.value.trim().length <= 20
            )
              clearError(field);
            if (
              field.id === "form-reader-phone" &&
              /^\d{10}$/.test(field.value.trim())
            )
              clearError(field);
            if (
              field.id === "form-reader-email" &&
              /^[^\s@]+@gmail\.com$/.test(field.value.trim())
            )
              clearError(field);
            if (
              field.id === "form-reader-address" &&
              field.value.trim().length >= 5 &&
              field.value.trim().length <= 100
            )
              clearError(field);
            if (field.id === "form-reader-img" && field.files.length > 0)
              clearError(field);
          });
          field.addEventListener("change", () => {
            if (field.id === "form-reader-gender" && field.value)
              clearError(field);
            if (field.id === "form-reader-dob" && field.value)
              clearError(field);
          });
        }
      });

      readerForm.addEventListener("submit", function (e) {
        if (!validateReaderForm()) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
    </script>
  </body>
</html>
